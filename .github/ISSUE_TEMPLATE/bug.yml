name: Bug Report
description: Report an issue or bug with the package
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce the bug
      description: Include relevant configuration and reliable reproduction steps.
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package Version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP Version
      placeholder: 8.4.0
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel Version
      placeholder: 13.0.0
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add any other relevant context.
